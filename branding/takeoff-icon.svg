<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1fb3c4"/>
      <stop offset="0.55" stop-color="#0f8296"/>
      <stop offset="1" stop-color="#065063"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4feff"/>
      <stop offset="1" stop-color="#c9eef5"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset="1" stop-color="#a9dfe9"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff0ff"/>
      <stop offset="1" stop-color="#3fb2f0"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa6f2"/>
      <stop offset="1" stop-color="#1550c8"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7fe6"/>
      <stop offset="1" stop-color="#0e3a9e"/>
    </linearGradient>
    <linearGradient id="bletter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee8ff"/>
      <stop offset="0.5" stop-color="#2f9bf3"/>
      <stop offset="1" stop-color="#1b4fd1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00242c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="46" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="46" fill="url(#gloss)"/>
  <rect x="9" y="9" width="238" height="238" rx="45" fill="none" stroke="#8ff0fb" stroke-opacity="0.35" stroke-width="2"/>

  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- clipboard -->
    <rect x="50" y="62" width="128" height="148" rx="16" fill="none" stroke="url(#ink)" stroke-width="11"/>
    <path d="M92 52h44a8 8 0 0 1 8 8v12a6 6 0 0 1-6 6H90a6 6 0 0 1-6-6V60a8 8 0 0 1 8-8z" fill="url(#ink)"/>
    <circle cx="114" cy="47" r="10" fill="none" stroke="url(#ink)" stroke-width="7"/>
    <!-- selection frame corners -->
    <g fill="none" stroke="url(#ink)" stroke-width="8">
      <path d="M74 114v-16h16"/>
      <path d="M138 98h16v16"/>
      <path d="M74 160v16h16"/>
      <path d="M154 160v16h-12"/>
      <!-- inner takeoff region -->
      <path d="M118 120H96v40h26"/>
      <path d="M100 140h0"/>
    </g>
    <!-- pencil -->
    <g transform="translate(178 160) rotate(-45)">
      <rect x="-12" y="-46" width="24" height="70" rx="5" fill="url(#pencil)"/>
      <rect x="-12" y="-46" width="24" height="12" rx="4" fill="#d6f5fb"/>
      <path d="M-12 24h24l-12 22z" fill="#e9fbff"/>
      <path d="M-4 38.5h8l-4 7.5z" fill="#0b6b7d"/>
      <path d="M0 -30v50" stroke="#87cfdc" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- BuildSuite badge: cube + B -->
  <g transform="translate(182 182) scale(0.8)" filter="url(#shadow)">
    <path d="M10 8l14-8 14 8-14 8z" fill="url(#cubeTop)"/>
    <path d="M10 8l14 8v34l-14-8z" fill="url(#cubeLeft)"/>
    <path d="M24 16l4-2.3v34l-4 2.3z" fill="url(#cubeRight)"/>
    <path d="M30 14h18c12 0 18 6 18 14 0 5-3 9-7 11 6 2 9 7 9 12 0 10-8 16-20 16H30z
             M41 24v12h7c4 0 7-2 7-6s-3-6-7-6z
             M41 45v13h8c5 0 8-2 8-6.5S54 45 49 45z" fill="url(#bletter)" fill-rule="evenodd" stroke="#0a2f88" stroke-width="1.6"/>
  </g>
</svg>
