name: Windows installer

# Builds BuildSuite Takeoff Studio for Windows (NSIS installer with the Terms of Service page),
# smoke-tests the desktop app, and uploads the installer as a workflow artifact.
# Pushing a tag like v1.0.0 also attaches the installer to a GitHub release.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths: # branch pushes only; tag pushes always build
      - 'src/**'
      - 'public/**'
      - 'electron/**'
      - 'build/**'
      - 'legal/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - '.github/workflows/windows-installer.yml'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: npm run dist:win

      - name: Desktop smoke test
        run: node scripts/desktop-smoke.mjs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BuildSuite-Takeoff-Studio-Setup
          path: release/BuildSuite-Takeoff-Studio-Setup-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/BuildSuite-Takeoff-Studio-Setup-*.exe
